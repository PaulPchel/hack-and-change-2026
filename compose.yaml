services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      DB_PATH: /app/storage/app.db
    volumes:
      - ./data:/app/data:ro        # сюда кладём knowledge-base.zip (в git не попадает)
      - ./storage:/app/storage     # история диалогов и заявки (SQLite)
    restart: unless-stopped
